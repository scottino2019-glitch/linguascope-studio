<!-- 2. CARD CON SLIDER DI FOTO (HTML + CSS + JS PURO) -->
<!-- Funziona in qualsiasi sito senza installare nulla -->

<div class="card-visual-story" id="photoSliderCard">
  <!-- Intestazione -->
  <div class="cvs-header">
    <span class="cvs-badge">🎨 Arti Visive</span>
    <span class="cvs-counter" id="cvsCounter">1 / 3</span>
  </div>

  <!-- Finestra Fotografica a Scorrimento -->
  <div class="cvs-slider-box">
    <div class="cvs-track" id="cvsTrack">
      <div class="cvs-slide">
        <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=700&q=80" alt="Ceramica" />
        <div class="cvs-caption">1. Argilla grezza e calcare naturale esposti in mostra</div>
      </div>
      <div class="cvs-slide">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=700&q=80" alt="Vetro" />
        <div class="cvs-caption">2. Sculture di fuoco e vetro con pigmenti caldi</div>
      </div>
      <div class="cvs-slide">
        <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=700&q=80" alt="Atelier" />
        <div class="cvs-caption">3. Superfici porose illuminate dalla luce d'ombra</div>
      </div>
    </div>

    <!-- Frecce di Scorrimento -->
    <button class="cvs-nav-btn prev" id="cvsPrev">‹</button>
    <button class="cvs-nav-btn next" id="cvsNext">›</button>
  </div>

  <!-- Indicatori di Selezione a Pallino -->
  <div class="cvs-dots" id="cvsDots">
    <button class="dot active" data-index="0"></button>
    <button class="dot" data-index="1"></button>
    <button class="dot" data-index="2"></button>
  </div>

  <!-- Testo e Azione -->
  <div class="cvs-details">
    <h3 class="cvs-title">Forme del Vuoto a Kyoto</h3>
    <div class="cvs-footer">
      <span>3 scatti fotografici</span>
      <a href="#" class="cvs-link">Guarda la serie →</a>
    </div>
  </div>
</div>

<style>
.card-visual-story {
  width: 100%;
  max-width: 360px;
  border-radius: 38px;
  padding: 18px;
  background: linear-gradient(180deg, #8A2387 0%, #E94057 50%, #F27121 100%);
  color: #ffffff;
  box-shadow: 0 20px 45px rgba(233, 64, 87, 0.38);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
}

.cvs-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.cvs-badge {
  padding: 6px 12px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  font-size: 12px;
  font-weight: bold;
}

.cvs-counter {
  padding: 4px 10px;
  border-radius: 9999px;
  background: rgba(0, 0, 0, 0.3);
  font-size: 11px;
  font-family: monospace;
  font-weight: bold;
}

.cvs-slider-box {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
  border: 2px solid rgba(255, 255, 255, 0.3);
}

.cvs-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.5s ease-out;
}

.cvs-slide {
  position: relative;
  width: 100%;
  height: 100%;
  flex-shrink: 0;
}

.cvs-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cvs-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 18px 14px 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  font-size: 12px;
  color: #ffffff;
}

.cvs-nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  color: #111;
  border: none;
  font-size: 18px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.cvs-nav-btn.prev { left: 10px; }
.cvs-nav-btn.next { right: 10px; }
.cvs-nav-btn:hover { background: #fff; }

.cvs-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 12px 0;
}

.cvs-dots .dot {
  width: 8px;
  height: 8px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.4);
  border: none;
  cursor: pointer;
  transition: all 0.3s;
}

.cvs-dots .dot.active {
  width: 30px;
  background: #ffffff;
}

.cvs-title {
  margin: 0 0 8px;
  font-family: Georgia, serif;
  font-size: 20px;
  font-weight: bold;
}

.cvs-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.2);
  font-size: 12px;
}

.cvs-link {
  color: #fff;
  font-weight: bold;
  text-decoration: none;
}
.cvs-link:hover { text-decoration: underline; }
</style>

<script>
(function() {
  const track = document.getElementById('cvsTrack');
  const counter = document.getElementById('cvsCounter');
  const dots = document.querySelectorAll('#cvsDots .dot');
  let current = 0;
  const total = 3;

  function goToSlide(index) {
    current = index;
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    counter.textContent = (current + 1) + ' / ' + total;
    dots.forEach((d, i) => {
      d.classList.toggle('active', i === current);
    });
  }

  document.getElementById('cvsPrev').addEventListener('click', () => {
    goToSlide(current === 0 ? total - 1 : current - 1);
  });
  document.getElementById('cvsNext').addEventListener('click', () => {
    goToSlide(current === total - 1 ? 0 : current + 1);
  });

  dots.forEach(dot => {
    dot.addEventListener('click', (e) => {
      goToSlide(parseInt(e.target.getAttribute('data-index')));
    });
  });
})();
</script>
